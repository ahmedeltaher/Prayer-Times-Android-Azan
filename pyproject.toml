[project]
name = "azan-mcp"
version = "0.1.0"
description = "Islamic utilities MCP server — prayer times, calendar, Du'a & Dhikr, Zakat calculators"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["mcp", "islamic", "prayer", "azan", "hijri", "quran"]
dependencies = [
    "mcp[cli]>=1.27",
    "hijridate>=2.0",
    "tzdata>=2026.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
]

[project.scripts]
azan-mcp = "azan_mcp.server:main"

[project.urls]
Homepage = "https://github.com/youruser/azan-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azan_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
# FastMCP tools return plain dict for MCP serialization — allow unparameterised dict in return types
disable_error_code = ["type-arg"]
